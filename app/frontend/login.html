<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to the SalesDesk CRM workspace.">
    <title>Sign In | SalesDesk</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%234338ca'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
    <script src="/static/js/theme-init.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <script type="module" src="/static/js/login.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="app-shell">
      <aside id="app-sidebar" class="app-sidebar" aria-label="Primary"></aside>
      <div class="app-main">
        <header class="site-header app-topbar"></header>
        <main id="main" class="auth-shell">
          <div class="page-intro">
            <h1 id="auth-heading">Sign in to SalesDesk</h1>
            <p id="auth-subheading">Use your work account to open customers, schedules, analytics and approvals.</p>
          </div>

          <section class="auth-card" aria-labelledby="auth-heading">
            <div class="auth-mode-tabs" role="tablist" aria-label="Authentication mode">
              <button id="tab-login" class="auth-tab active" type="button" role="tab" aria-selected="true">Sign in</button>
              <button id="tab-register" class="auth-tab" type="button" role="tab" aria-selected="false">Create account</button>
            </div>

            <form id="login-form" class="auth-form" novalidate>
              <div id="register-name-group" class="form-grid" hidden>
                <label class="field field-wide">
                  <span>Full name <span class="required-mark" aria-hidden="true">*</span></span>
                  <input id="auth-full-name" name="full_name" maxlength="255" autocomplete="name" placeholder="e.g. Jordan Taylor">
                </label>
              </div>
              <div class="form-grid">
                <label class="field field-wide">
                  <span>Work email <span class="required-mark" aria-hidden="true">*</span></span>
                  <input id="auth-email" name="email" type="text" required maxlength="320" autocomplete="email" inputmode="email" placeholder="name@company.com">
                  <span class="field-error"></span>
                </label>
                <label class="field field-wide">
                  <span>Password <span class="required-mark" aria-hidden="true">*</span></span>
                  <input id="auth-password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="At least 8 characters">
                </label>
              </div>
              <p id="auth-error" class="form-alert" role="alert" hidden></p>
              <p id="auth-notice" class="auth-notice" role="status" hidden></p>
              <div class="form-actions">
                <p class="auth-session-note">You stay signed in until this browser tab session ends.</p>
                <button id="auth-submit" class="button button-primary" type="submit">
                  <span data-auth-label>Sign in</span>
                </button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
